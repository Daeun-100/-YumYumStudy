name: Check
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master, develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run export:web
        env:
          APP_VARIANT: test
          EXPO_PUBLIC_APP_VARIANT: test
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Check production version
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        run: |
          # Workflow-only repairs reuse the already verified release artifacts.
          # Any application or other source change still requires version validation.
          if git diff --quiet origin/master...HEAD -- . ':!.github/workflows'; then
            echo 'Workflow-only change; existing application version is unchanged.'
          else
            node scripts/check-release.mjs
          fi
