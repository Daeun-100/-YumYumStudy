<!doctype html>

    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 36px 24px; }

    .note { margin: 14px 0 0; color: #889187; font-size: 12px; line-height: 1.6; }

    li + li { margin-top: 6px; }
    .open-app { color: #3e8067; font-weight: 600; text-underline-offset: 3px; }
    footer { margin-top: 36px; font-size: 12px; color: #889187; }
