name: Check
on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [master, develop]
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Install isolated PostgreSQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/admin-toast-db" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.3.14
      - name: Verify admin toast grants and RLS in PostgreSQL
        run: PGLITE_MODULE="$RUNNER_TEMP/admin-toast-db/node_modules/@electric-sql/pglite/dist/index.js" node --experimental-strip-types --test tests/admin-toasts-db.test.mjs
      - run: npm run export:web
        env:
          APP_VARIANT: test
          EXPO_PUBLIC_APP_VARIANT: test
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Verify Android bundle alongside web
        run: npx expo export --platform android --output-dir /tmp/yumyum-android-export
        env:
          APP_VARIANT: test
          EXPO_PUBLIC_APP_VARIANT: test
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Check app version metadata (APK version advancement is checked by deployment)
        run: node scripts/deployment.mjs check
      - name: Verify release review against current source and production APK
        if: github.event_name == 'pull_request' && github.base_ref == 'master'
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_BASE: ${{ github.event.pull_request.base.sha }}
          APP_VARIANT: production
          EXPO_PUBLIC_APP_VARIANT: production
          EXPO_NO_DOTENV: '1'
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/deployment.mjs review-check
