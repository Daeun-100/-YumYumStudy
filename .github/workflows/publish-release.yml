name: Publish Friend Release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Already published stable release to verify and publish'
        required: true
        default: v1.0.0
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  publish:
    if: (github.event_name == 'release' && github.event.release.prerelease == false) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    environment: production
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      SUPABASE_RELEASE_SECRET_KEY: ${{ secrets.SUPABASE_RELEASE_SECRET_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EAS_HOSTING_DOMAIN: ${{ vars.EAS_HOSTING_DOMAIN }}
      APP_VARIANT: production
      EXPO_PUBLIC_APP_VARIANT: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install project dependencies for Expo config plugins
        run: npm ci
      - name: Verify published release against successful master build
        id: candidate
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected stable release tag'; exit 1; }
            gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '{release: .}' > publication-event.json
            GITHUB_EVENT_PATH="$PWD/publication-event.json" node scripts/release-candidate.mjs verify
          else
            node scripts/release-candidate.mjs verify
          fi
      - name: Verify Supabase access and prevent publishing older versions
        run: node scripts/publish-release-info.mjs preflight
      - name: Promote the verified web without rebuilding
        env:
          DEPLOYMENT_ID: ${{ steps.candidate.outputs.deployment_id }}
        run: npx --yes eas-cli@25.3.0 deploy:alias --id "$DEPLOYMENT_ID" --prod --non-interactive
      - name: Enable Android and web update notices
        run: node scripts/publish-release-info.mjs publish
      - name: Summarize publication
        run: echo 'Verified web promoted and Supabase update notices enabled. APK is attached to the GitHub Release.' >> "$GITHUB_STEP_SUMMARY"
