name: Cloud Build
on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      target:
        description: 'test: develop APK / production: master auto APK or OTA'
        required: true
        default: test
        type: choice
        options: [test, production]
permissions:
  contents: read
  actions: read
concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || inputs.target }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      variant: ${{ steps.input.outputs.variant }}
      sha: ${{ steps.input.outputs.sha }}
      mode: ${{ steps.plan.outputs.mode || 'apk' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate branch and freeze commit
        id: input
        env:
          TARGET: ${{ github.event_name == 'push' && 'production' || inputs.target }}
        run: |
          if [ "$TARGET" = test ]; then EXPECTED=refs/heads/develop; else EXPECTED=refs/heads/master; fi
          test "$GITHUB_REF" = "$EXPECTED" || { echo "Choose branch $EXPECTED for $TARGET"; exit 1; }
          echo "variant=$TARGET" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Choose production deployment from the published APK runtime
        if: steps.input.outputs.variant == 'production'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          APP_VARIANT: production
          EXPO_PUBLIC_APP_VARIANT: production
          EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          EXPO_NO_DOTENV: '1'
        run: npx --yes eas-cli@25.3.0 env:exec production 'node scripts/deployment.mjs plan' --non-interactive
      - if: steps.plan.outputs.mode == 'apk'
        run: node scripts/check-release.mjs
      - name: Save production deployment plan
        if: always() && steps.input.outputs.variant == 'production'
        uses: actions/upload-artifact@v4
        with:
          name: deployment-plan-${{ github.sha }}
          path: |
            deployment-plan.json
            deployment-review.json
            deployment-review-validation.json
            native-compatibility.json
          retention-days: 90
          if-no-files-found: ignore
      - name: Summarize production plan
        if: always() && steps.input.outputs.variant == 'production'
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: node scripts/deployment.mjs summary
  android:
    if: needs.prepare.outputs.mode == 'apk'
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APP_VARIANT: ${{ needs.prepare.outputs.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ needs.prepare.outputs.variant }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/cloud-preflight.mjs
      - name: Build APK on EAS (wait for the result)
        run: npx --yes eas-cli@25.3.0 build --platform android --profile "$APP_VARIANT" --non-interactive --wait --json > android-build.json
      - if: always()
        run: node scripts/build-record.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-${{ needs.prepare.outputs.variant }}-${{ needs.prepare.outputs.sha }}
          retention-days: 90
          path: |
            android-build.json
            build-record.json
  web:
    if: needs.prepare.outputs.mode == 'apk' || needs.prepare.outputs.mode == 'update'
    needs: prepare
    outputs:
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      APP_VARIANT: ${{ needs.prepare.outputs.variant }}
      EXPO_PUBLIC_APP_VARIANT: ${{ needs.prepare.outputs.variant }}
      EAS_HOSTING_DOMAIN: ${{ vars.EAS_HOSTING_DOMAIN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: node --experimental-strip-types scripts/cloud-preflight.mjs
      - run: npm run export:web
      - name: Publish preview only (never production)
        id: deploy
        run: |
          test -n "$EAS_HOSTING_DOMAIN" || { echo 'Configure EAS_HOSTING_DOMAIN'; exit 1; }
          npx --yes eas-cli@25.3.0 deploy --dev-domain "$EAS_HOSTING_DOMAIN" --id "$APP_VARIANT-${GITHUB_SHA:0:12}-$GITHUB_RUN_NUMBER-$GITHUB_RUN_ATTEMPT" --json > web-deployment.json
          node -e 'const fs=require("node:fs"); const web=JSON.parse(fs.readFileSync("web-deployment.json")); const expected=`${process.env.APP_VARIANT}-${process.env.GITHUB_SHA.slice(0,12)}-${process.env.GITHUB_RUN_NUMBER}-${process.env.GITHUB_RUN_ATTEMPT}`; if(web.identifier!==expected) throw Error("Unexpected web deployment identifier"); fs.appendFileSync(process.env.GITHUB_OUTPUT,`deployment_id=${web.identifier}\n`);'
      - if: always()
        run: node scripts/build-record.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-${{ needs.prepare.outputs.variant }}-${{ needs.prepare.outputs.sha }}
          retention-days: 90
          path: |
            web-deployment.json
            build-record.json
            dist/
  record:
    needs: [prepare, android, web]
    if: needs.prepare.outputs.variant == 'production' && needs.prepare.outputs.mode == 'apk'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-release.mjs > release.json
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Prepare verified candidate manifest and permanent APK asset
        run: node scripts/release-candidate.mjs create
      - name: Record version and candidate outputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(node -p "require('./release.json').tag")
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > /tmp/release-is-draft; then
            test "$(cat /tmp/release-is-draft)" = true || { echo 'Published release assets are immutable; create a new version.'; exit 1; }
          fi
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --draft --title "$TAG" --notes "Candidate built from $GITHUB_SHA. Verify before sharing. Web production URL is unchanged."
          tar -czf build-results.tgz results
          APK=$(node -p "require('./candidate.json').apkName")
          gh release upload "$TAG" release.json candidate.json "$APK" build-results.tgz --clobber

      - name: Save APK candidate metadata for deployment history
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-metadata-${{ github.sha }}
          retention-days: 90
          if-no-files-found: ignore
          path: |
            candidate.json
            release.json

  update:
    needs: [prepare, web]
    if: needs.prepare.outputs.mode == 'update'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      APP_VARIANT: production
      EXPO_PUBLIC_APP_VARIANT: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_NO_DOTENV: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: deployment-plan-${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: web-production-${{ github.sha }}
          path: results/web-ota
      - name: Publish checked master code to the production channel
        run: npx --yes eas-cli@25.3.0 env:exec production 'node scripts/deployment.mjs publish' --non-interactive
      - name: Promote the same commit web after verified Android OTA
        env:
          WEB_DEPLOYMENT_ID: ${{ needs.web.outputs.deployment_id }}
        run: node scripts/deployment.mjs promote-web
      - name: Record update result
        if: always()
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: node scripts/deployment.mjs summary
      - name: Retain deployment and EAS response
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-update-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          path: |
            deployment-plan.json
            eas-update.json
            update-record.json
            deployment-review.json
            deployment-review-validation.json
            native-compatibility.json
      - name: Retain web promotion result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-promotion-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: ignore
          path: publication/web-promotion-record.json

  history:
    needs: [prepare, android, web, record, update]
    if: always() && github.ref == 'refs/heads/master' && (github.event_name == 'push' || inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        id: history-checkout
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Gather this run's deployment JSON (including failed routes)
        uses: actions/download-artifact@v4
        with:
          pattern: '*${{ github.sha }}*'
          path: history-input
      - name: Append immutable JSON records to deployment-history
        if: always() && steps.history-checkout.outcome == 'success'
        env:
          DEPLOYMENT_JOB_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/deployment-history.mjs
